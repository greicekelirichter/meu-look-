<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8e4660">
<link rel="manifest" href="manifest.json">
<title>Meu Look</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <div class="eyebrow">SEU GUARDA-ROUPA</div>
      <h1>Meu Look ✨</h1>
    </div>
    <button class="icon" id="profileBtn">⚙️</button>
  </header>

  <main id="content"></main>

  <nav class="bottom">
    <button data-tab="home" class="active">⌂<span>Início</span></button>
    <button data-tab="closet">👗<span>Closet</span></button>
    <button data-tab="create">✨<span>Criar look</span></button>
    <button data-tab="favorites">♡<span>Favoritos</span></button>
  </nav>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <button class="close" id="closeModal">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
